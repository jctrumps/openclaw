---
- name: Deploy OpenClaw Gateway to Ubuntu VM
  hosts: openclaw
  become: true
  gather_facts: true
  pre_tasks:
    - name: Check for operator overrides on control machine
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/group_vars/local.yml"
      register: operator_overrides
      delegate_to: localhost
      become: false
    - name: Load ignored local overrides if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/group_vars/local.yml"
      when: operator_overrides.stat.exists
    - name: Require Ubuntu 24.04 (supported deployment target)
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('24.04', '==')
          - ansible_architecture == 'x86_64'
        fail_msg: 'Use an Ubuntu 24.04 amd64 cloud-init VM or extend the OS compatibility checks.'
  tasks:
    - name: Install apt utilities
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, git, openssl, python3, python3-apt, ufw]
        state: present
        update_cache: true
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Download Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
    - name: Configure official Docker Ubuntu repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true
    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
    - name: Add deployment user to docker group
      ansible.builtin.user:
        name: "{{ openclaw_os_user }}"
        groups: docker
        append: true
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ openclaw_app_dir }}"
        state: directory
        owner: "{{ openclaw_os_user }}"
        group: "{{ openclaw_os_user }}"
        mode: '0750'
    - name: Create private persistent state directories
      ansible.builtin.file:
        path: "{{ openclaw_data_dir }}/{{ item }}"
        state: directory
        owner: "{{ openclaw_os_user }}"
        group: "{{ openclaw_os_user }}"
        mode: '0700'
      loop: [state, auth-profile-secrets, repos, gh-config, ssh-config]
    - name: Detect existing Gateway secret env file
      ansible.builtin.stat:
        path: "{{ openclaw_app_dir }}/.env"
      register: gateway_env
    - name: Generate unique gateway token on guest once
      ansible.builtin.command: openssl rand -hex 32
      register: generated_gateway_token
      changed_when: true
      when: not gateway_env.stat.exists
      no_log: true
    - name: Write private gateway token env only on first deployment
      ansible.builtin.copy:
        dest: "{{ openclaw_app_dir }}/.env"
        content: "OPENCLAW_GATEWAY_TOKEN={{ generated_gateway_token.stdout }}\n"
        owner: "{{ openclaw_os_user }}"
        group: "{{ openclaw_os_user }}"
        mode: '0600'
        force: false
      when: not gateway_env.stat.exists
      no_log: true
    - name: Install Compose specification
      ansible.builtin.template:
        src: templates/compose.yml.j2
        dest: "{{ openclaw_app_dir }}/compose.yml"
        owner: "{{ openclaw_os_user }}"
        group: "{{ openclaw_os_user }}"
        mode: '0640'
    - name: Check for existing OpenClaw config
      ansible.builtin.stat:
        path: "{{ openclaw_data_dir }}/state/openclaw.json"
      register: existing_openclaw_config
    - name: Check whether initial gateway settings were fully applied
      ansible.builtin.stat:
        path: "{{ openclaw_data_dir }}/.initial-config-complete"
      register: initialized_gateway_settings
    - name: Bootstrap a baseline OpenClaw config once
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - run
          - --rm
          - --no-deps
          - --entrypoint
          - node
          - openclaw-gateway
          - dist/index.js
          - setup
          - --baseline
        chdir: "{{ openclaw_app_dir }}"
      become_user: "{{ openclaw_os_user }}"
      when: not existing_openclaw_config.stat.exists
    - name: Set gateway mode only on initial bootstrap
      ansible.builtin.command:
        argv: [docker, compose, run, --rm, --no-deps, --entrypoint, node, openclaw-gateway, dist/index.js, config, set, gateway.mode, local]
        chdir: "{{ openclaw_app_dir }}"
      become_user: "{{ openclaw_os_user }}"
      when: not initialized_gateway_settings.stat.exists
    - name: Set Cloudflare HTTPS public origin for browser auth on initial bootstrap
      ansible.builtin.command:
        argv: [docker, compose, run, --rm, --no-deps, --entrypoint, node, openclaw-gateway, dist/index.js, config, set, gateway.publicOrigin, "{{ openclaw_public_origin }}"]
        chdir: "{{ openclaw_app_dir }}"
      become_user: "{{ openclaw_os_user }}"
      when: not initialized_gateway_settings.stat.exists
    - name: Record completion of initial gateway settings
      ansible.builtin.file:
        path: "{{ openclaw_data_dir }}/.initial-config-complete"
        state: touch
        owner: "{{ openclaw_os_user }}"
        group: "{{ openclaw_os_user }}"
        mode: '0640'
      when: not initialized_gateway_settings.stat.exists
    - name: Start OpenClaw Gateway container
      community.docker.docker_compose_v2:
        project_src: "{{ openclaw_app_dir }}"
        services: [openclaw-gateway]
        state: present
        pull: missing
      become_user: "{{ openclaw_os_user }}"
    - name: Display next steps
      ansible.builtin.debug:
        msg:
          - 'OpenClaw container started; listen port is loopback only.'
          - 'Run the documented ChatGPT OAuth device-code login on the VM.'
          - 'Cloudflare Tunnel is MANUAL ONLY and not configured by this playbook.'
          - "Public hostname example: {{ openclaw_public_origin }}"
